services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inferops
      POSTGRES_USER: inferops
      POSTGRES_PASSWORD: inferops_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ../backend
    ports:
      - "8000:8000"
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://inferops:inferops_password@postgres:5432/inferops

      REDIS_URL: redis://redis:6379/0

      QDRANT_URL: http://qdrant:6333
      RAG_COLLECTION_NAME: inferops_knowledge
      EMBEDDING_MODEL_NAME: sentence-transformers/all-MiniLM-L6-v2

      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3.1:8b

      OLLAMA_CLOUD_BASE_URL: https://ollama.com
      OLLAMA_CLOUD_API_KEY: ${OLLAMA_CLOUD_API_KEY:-}
      OLLAMA_CLOUD_MODEL: gpt-oss:120b-cloud

      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ../backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - postgres
      - redis
      - qdrant

  frontend:
    build:
      context: ../frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus

volumes:
  postgres_data:
  qdrant_data:
  grafana_data: