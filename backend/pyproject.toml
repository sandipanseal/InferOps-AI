[project]
name = "inferops-ai-backend"
version = "0.1.0"
description = "Budget-aware observable LLM gateway"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic-settings>=2.4.0",
  "httpx>=0.27.0",
  "aiosqlite>=0.20.0",
  "redis>=5.0.0",
  "sqlalchemy[asyncio]>=2.0.0",
  "prometheus-client>=0.20.0",
  "opentelemetry-api>=1.27.0",
  "opentelemetry-sdk>=1.27.0",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "pytest>=8.0.0",
  "numpy>=1.26,<2.3",
  # pyarrow is a transitive dep via `datasets`. Newer 22/23/24 dropped cp311
  # wheels; pinning to 21.x keeps a prebuilt wheel and avoids source-building
  # numpy (which needs GCC >= 9.3, but AL2 ships 7.3).
  "pyarrow>=21.0.0,<22",
  "sentence-transformers>=2.7.0",
  "pypdf>=4.2.0",
  "python-docx>=1.1.2",
  "python-multipart>=0.0.9",
  "asyncpg>=0.29.0",
  "psycopg2-binary>=2.9.0",
  "pgvector>=0.2.5",
  "pytest-asyncio>=0.23.0",
  "langchain>=0.3.0,<1.0",
  "langchain-openai>=0.2.0,<1.0",
  "langchain-community>=0.3.0,<1.0",
  "openai>=1.40.0",
  "ragas>=0.2.0,<0.5",
  "datasets>=2.20.0",
  "mangum>=0.17.0",
  "boto3>=1.34.0",
  "langfuse>=2.0.0,<3.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
