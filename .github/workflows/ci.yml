name: InferOps AI CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Import FastAPI app
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci_test.db
          REDIS_URL: redis://localhost:6379/0
          QDRANT_URL: http://localhost:6333
          OPENAI_API_KEY: dummy
          OLLAMA_CLOUD_API_KEY: dummy
        run: |
          python -c "from app.main import app; print(app.title)"

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: npm run build

  docker:
    name: Docker build checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t inferops-backend ./backend

      - name: Build frontend image
        run: docker build -t inferops-frontend ./frontend

      - name: Validate production compose
        run: |
          cp .env.example .env.prod || true
          docker compose -f infra/docker-compose.prod.yml --env-file .env.prod config