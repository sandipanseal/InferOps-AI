# =============================================================================
# SonarQube / SonarCloud project configuration
# =============================================================================
# The actual thresholds (coverage > 80%, duplicated lines < 3%) are enforced
# by a Quality Gate configured in the SonarQube server (see README section
# "SonarQube Quality Gate"). This file only tells the scanner WHAT to analyze
# and WHERE to find coverage / test reports.
# =============================================================================

sonar.projectKey=sandipanseal_InferOps-AI
sonar.organization=sandipanseal
sonar.projectName=InferOps-AI
sonar.projectVersion=1.0

# ----- Sources & tests ------------------------------------------------------
sonar.sources=backend/app,frontend/app,frontend/components,frontend/lib
sonar.tests=backend/tests,Test
sonar.sourceEncoding=UTF-8

# Exclude generated / vendored / non-product code from analysis & duplication
sonar.exclusions=\
    **/node_modules/**,\
    **/.next/**,\
    **/dist/**,\
    **/build/**,\
    **/__pycache__/**,\
    **/*.min.js,\
    frontend/next-env.d.ts,\
    infra/**,\
    loadtests/**,\
    docs/**

# Exclude tests + scaffolding from coverage measurement
sonar.coverage.exclusions=\
    backend/tests/**,\
    Test/**,\
    backend/app/db/init_db.py,\
    backend/app/main.py,\
    frontend/app/**/layout.tsx,\
    frontend/app/**/page.tsx

# Exclude generated / trivial files from duplication detection
sonar.cpd.exclusions=\
    **/*.config.*,\
    frontend/tailwind.config.ts,\
    frontend/postcss.config.js,\
    frontend/next.config.ts

# ----- Python --------------------------------------------------------------
sonar.python.version=3.11
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.python.xunit.reportPath=backend/pytest-report.xml

# ----- JavaScript / TypeScript ---------------------------------------------
sonar.typescript.tsconfigPath=frontend/tsconfig.json
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
